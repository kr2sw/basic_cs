<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>고급 JS 연동</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    button { margin: 4px; padding: 8px 16px; cursor: pointer; }
    pre { background: #f4f4f4; padding: 10px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>고급 JS ↔ WASM 연동</h1>
  <button onclick="stringRead()">WASM → JS 문자열 읽기</button>
  <button onclick="stringWrite()">JS → WASM 문자열 쓰기</button>
  <button onclick="transform()">zero-copy 변환 (2배)</button>
  <button onclick="bench()">WASM vs JS 합계 벤치마크</button>
  <pre id="out"></pre>

  <script>
    const out = document.getElementById('out');
    let exports = null;
    let memory = null;

    async function init() {
      const { instance } = await WebAssembly.instantiateStreaming(fetch('interop.wasm'));
      exports = instance.exports;
      memory = exports.memory;
    }

    function print(m) {
      out.textContent = (out.textContent ? out.textContent + '\n' : '') + m;
    }

    // WASM → JS: 포인터/길이를 받아 디코딩
    function stringRead() {
      const ptr = exports.helloPtr();
      const bytes = new Uint8Array(memory.buffer, ptr, exports.strLenAt(ptr));
      print(`WASM 문자열: "${new TextDecoder().decode(bytes)}"`);
    }

    // JS → WASM: TextEncoder로 인코딩해 메모리에 기록, 포인터/길이만 전달
    function stringWrite() {
      const text = '안녕, WASM!';
      const bytes = new TextEncoder().encode(text);
      const dst = 512;
      new Uint8Array(memory.buffer).set(bytes, dst);
      exports.rememberString(dst, bytes.length);
      const back = new TextDecoder().decode(
        new Uint8Array(memory.buffer, exports.stringPtr(), exports.stringLen()));
      print(`JS에서 쓴 문자열: "${back}" (일치=${back === text})`);
    }

    // zero-copy: JS 뷰로 데이터를 넣고 WASM이 메모리에서 직접 변환
    function transform() {
      const N = 10;
      const view = new Int32Array(memory.buffer, 0, N);
      for (let i = 0; i < N; i++) view[i] = i + 1;
      exports.transform(0, N * 4);
      print(`transform 결과: [${Array.from(view).join(', ')}] (전부 2배됨)`);
    }

    // 성능 비교: WASM 루프 vs JS 루프
    function bench() {
      const N = 400000;
      const view = new Int32Array(memory.buffer, 0, N);
      for (let i = 0; i < N; i++) view[i] = i;

      let t0 = performance.now();
      const r1 = exports.sumArray(0, N * 4);
      const wasmMs = performance.now() - t0;

      t0 = performance.now();
      const r2 = view.reduce((a, b) => a + b, 0);
      const jsMs = performance.now() - t0;

      print(`WASM 합계=${r1} (${wasmMs.toFixed(2)}ms), JS 합계=${r2} (${jsMs.toFixed(2)}ms)`);
    }

    init().catch(console.error);
  </script>
</body>
</html>
