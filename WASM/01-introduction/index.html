<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>WebAssembly 소개</title>
</head>
<body>
  <h1>WebAssembly 시작하기</h1>
  <p>add(3, 5) = <span id="add-result"></span></p>
  <p>square(7) = <span id="square-result"></span></p>
  <p>factorial(10) = <span id="fact-result"></span></p>

  <script>
    WebAssembly.instantiateStreaming(fetch('add.wasm'))
      .then(({ instance }) => {
        const { add, square, factorial } = instance.exports;
        document.getElementById('add-result').textContent = add(3, 5);
        document.getElementById('square-result').textContent = square(7);
        document.getElementById('fact-result').textContent = factorial(10);
      })
      .catch(console.error);
  </script>
</body>
</html>
