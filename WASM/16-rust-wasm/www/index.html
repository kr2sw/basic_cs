<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Rust → WASM</title>
  <script type="module">
    import init, { add, factorial, fibonacci, greet, Counter, sum_array } from '../pkg/wasm_game.js';

    async function run() {
      await init();
      const log = document.getElementById('output');
      log.textContent += `add(30, 12) = ${add(30, 12)}\n`;
      log.textContent += `factorial(10) = ${factorial(10)}\n`;
      log.textContent += `fibonacci(15) = ${fibonacci(15)}\n`;
      log.textContent += `greet("WASM") = ${greet("WASM")}\n`;

      const counter = Counter.new();
      log.textContent += `counter.increment() = ${counter.increment()}\n`;
      log.textContent += `counter.increment() = ${counter.increment()}\n`;
      log.textContent += `counter.get_count() = ${counter.get_count()}\n`;

      log.textContent += `sum_array([1,2,3,4,5]) = ${sum_array(new Int32Array([1,2,3,4,5]))}\n`;
    }
    run().catch(console.error);
  </script>
</head>
<body>
  <h1>Rust → WebAssembly</h1>
  <pre id="output"></pre>
</body>
</html>
