<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>WASM 타입과 연산자</title>
</head>
<body>
  <h1>WASM 타입과 연산자</h1>
  <pre id="output"></pre>

  <script>
    async function run() {
      const { instance } = await WebAssembly.instantiateStreaming(fetch('ops.wasm'));
      const { i32_ops, f64_ops, bit_ops, cmp_ops, convert } = instance.exports;
      const log = document.getElementById('output');

      const [add, sub, mul, div] = i32_ops(20, 6);
      log.textContent += `i32: 20 + 6 = ${add}\n`;
      log.textContent += `i32: 20 - 6 = ${sub}\n`;
      log.textContent += `i32: 20 * 6 = ${mul}\n`;
      log.textContent += `i32: 20 / 6 = ${div}\n\n`;

      const [fadd, fsub, fmul, fdiv] = f64_ops(20.5, 6.2);
      log.textContent += `f64: 20.5 + 6.2 = ${fadd}\n`;
      log.textContent += `f64: 20.5 - 6.2 = ${fsub}\n`;
      log.textContent += `f64: 20.5 * 6.2 = ${fmul}\n`;
      log.textContent += `f64: 20.5 / 6.2 = ${fdiv}\n\n`;

      log.textContent += `convert(42) = ${convert(42)}\n`;
    }
    run().catch(console.error);
  </script>
</body>
</html>
